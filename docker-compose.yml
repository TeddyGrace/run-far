services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: runfar
      POSTGRES_PASSWORD: runfar
      POSTGRES_DB: runfar
    ports:
      - "5432:5432"
    volumes:
      - runfar-postgres-data:/var/lib/postgresql/data

volumes:
  runfar-postgres-data:
