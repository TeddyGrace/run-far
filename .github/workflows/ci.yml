name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    # The API's tests are integration tests that hit a real Postgres.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: runfar
          POSTGRES_PASSWORD: runfar
          POSTGRES_DB: runfar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runfar"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://runfar:runfar@localhost:5432/runfar
      # Throwaway CI values. Never used outside this ephemeral runner.
      SESSION_SECRET: ci-session-secret-not-a-real-secret
      ENCRYPTION_KEY: cnVuZmFyLWNpLXRlc3Qta2V5LW5vdC1hLXNlY3JldCE=

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:migrate

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
