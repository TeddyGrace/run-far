# Single-service Railway deploy: API + SPA + linked Postgres plugin.
# Create a Postgres plugin in the project and link it so DATABASE_URL is injected.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
